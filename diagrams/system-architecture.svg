<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">System architecture — AI-assisted moderation prototype</title><desc id="desc">Browser-only prototype. Human actions and feedback, controller-managed session state, deterministic verification and decision logic, static simulated AI data, and optional external policy links. Logic receives arguments from controller and directly reads policy rules for selection validation.</desc>
